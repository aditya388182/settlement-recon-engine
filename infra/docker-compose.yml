name: recon

services:
  minio:
    image: minio/minio:latest
    container_name: recon-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - recon-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    container_name: recon-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/recon-landing;
      mc mb -p local/recon-lake;
      mc ls local;
      exit 0;"

  postgres-airflow:
    image: postgres:15
    container_name: recon-postgres-airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5433:5432"        # 5433 on the host: Project 1's Postgres owns 5432
    volumes:
      - recon-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  pushgateway:
    image: prom/pushgateway:v1.9.0
    container_name: recon-pushgateway
    ports:
      - "9091:9091"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: recon-prometheus
    depends_on: [pushgateway]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - recon-prom-data:/prometheus

  grafana:
    image: grafana/grafana:11.2.0
    container_name: recon-grafana
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - recon-grafana-data:/var/lib/grafana

volumes:
  recon-minio-data:
  recon-pg-data:
  recon-prom-data:
  recon-grafana-data:
