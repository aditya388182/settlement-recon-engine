# Day-1 stack: MinIO (object store) + bucket bootstrap + Postgres (Airflow
# metadata DB, provisioned now because it is cheap and Day 5 needs it).
# Prometheus / Grafana / pushgateway are added on Day 6.
#
# Container names are prefixed `recon-` on purpose: Project 1's compose file
# almost certainly already claims the name `minio`, and Docker refuses to start
# a second container with the same name even when the ports are free.
#
# Host ports 9000/9001 are the same ones Project 1 uses. On a 16GB machine do
# NOT run both stacks at once — that is a deliberate constraint, not an
# accident. Stop Project 1 first:
#   docker compose -f ../../payments-cdc-pipeline/infra/docker-compose.yml down

name: recon

services:
  minio:
    image: minio/minio:latest
    container_name: recon-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - recon-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    container_name: recon-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/recon-landing;
      mc mb -p local/recon-lake;
      mc ls local;
      exit 0;"

  postgres-airflow:
    image: postgres:15
    container_name: recon-postgres-airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5433:5432"        # 5433 on the host: Project 1's Postgres owns 5432
    volumes:
      - recon-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  recon-minio-data:
  recon-pg-data:
