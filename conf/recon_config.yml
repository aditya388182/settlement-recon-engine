# Multi-Source Settlement Reconciliation Engine — single source of truth.
# Nothing in this project hardcodes a tunable. Determinism depends on config
# being versioned, not baked into code.

run:
  rng_seed: 42
  business_date: "2026-07-06"

matching:
  settlement_window_days: 2          # T+2 max settlement lag
  ambiguity_density_threshold: 2.0   # candidates/record above which Hungarian activates
  block_prefix_len_default: 4
  block_prefix_len_hot: 8            # adaptive prefix for hot counterparties (Day 4)
  hot_counterparties: []             # salt list; populated Day 4, versioned here

# ---------------------------------------------------------------------------
# DAY-1 DECISION #3: reference-data parameters live HERE, not in a script.
# scripts/seed_generator.py and scripts/seed_reference_data.py BOTH read this
# block. The generator must corrupt AMOUNT_MISMATCH rows "beyond tolerance",
# and tolerance = f(fee schedule). If the generator invented its own numbers,
# Day 3's derived tolerance would silently disagree with Day 1's corruption
# and the whole answer key would be a lie.
# ---------------------------------------------------------------------------
reference_data:
  version: "v1"
  valid_from: "2026-07-01"
  valid_to: "9999-12-31"
  epsilon_minor: 1
  fee_schedule:        # kind = FEE_SCHEDULE ; fee = min(gross*rate_bps//10000, max_fee_minor)
    USD: { rate_bps: 290, max_fee_minor: 300 }
    EUR: { rate_bps: 290, max_fee_minor: 300 }
    GBP: { rate_bps: 290, max_fee_minor: 250 }
    JPY: { rate_bps: 290, max_fee_minor: 400 }
  fx_precision:        # kind = FX_PRECISION ; JPY is the zero-decimal trap
    USD: { decimals: 2, fx_rounding_minor: 1 }
    EUR: { decimals: 2, fx_rounding_minor: 1 }
    GBP: { decimals: 2, fx_rounding_minor: 1 }
    JPY: { decimals: 0, fx_rounding_minor: 1 }
  # total_tolerance(ccy) = max_fee_minor + fx_rounding_minor + epsilon_minor
  #   USD 302 | EUR 302 | GBP 252 | JPY 402
  # A formula that assumes 2 decimals everywhere inflates JPY 100x (40200) and
  # silently swallows real breaks. That is spark/tests/test_tolerance.py's case.

generator:
  currencies: [USD, EUR, GBP, JPY]
  merchant_count: 25                 # M001..M025
  main_merchants: [M001, M002, M003, M004, M005, M006, M007, M008, M009, M010,
                   M011, M012, M013, M014, M015, M016, M017, M018, M019, M020]
  trap_merchants: [M021, M022]       # reserved: keeps trap blocks free of stray rows
  dense_merchants: [M023, M024, M025]# reserved: one dense block per merchant
  amount_min_minor: 500
  amount_max_minor: 500000
  m2m_trap_groups: 20
  dense_blocks: 3
  bank_ref_mode: "shared"            # shared = bank carries the internal txn_ref (plan default)
                                     # batch  = bank carries "<MERCHANT>-B<7hex>" settlement ref
  rates:
    amount_mismatch: 0.05
    missing_in_processor: 0.01
    missing_in_bank: 0.01
    duplicate: 0.01
    timing_difference: 0.03

paths:
  landing: "s3a://recon-landing"
  lake: "s3a://recon-lake"
  canonical: "s3a://recon-lake/canonical"
  reference_data: "s3a://recon-lake/reference_data"
  recon_output: "s3a://recon-lake/recon_output"
  recon_summary: "s3a://recon-lake/recon_summary"

spark:
  shuffle_partitions: 8
  s3_endpoint: "http://localhost:9000"
  s3_access_key: "minioadmin"
  s3_secret_key: "minioadmin"
