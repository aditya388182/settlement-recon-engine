name: deploy


on:
  push:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the engine bundle
        run: |
          mkdir -p dist
          zip -r "dist/settlement-recon-engine-${GITHUB_SHA::7}.zip" \
            spark scripts conf great_expectations airflow \
            requirements-spark.txt requirements-ge.txt \
            -x '*__pycache__*'
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ github.sha }}
          path: dist/*.zip
          retention-days: 30

      
      - name: Deploy note
        run: |
          echo "Artifact published. The DAG picks it up on the next schedule."
          echo "In-flight runs are unaffected: every task is idempotent and the"
          echo "engine writes with replaceWhere scoped to its own partition."